<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upstream Data — Genset Build Guide</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

  <!-- Top Bar (Clean, Simple Header) -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <button id="homeBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-100 text-xs sm:text-sm font-semibold transition shadow-xs" title="Go to Home Overview">
          <i data-lucide="home" class="w-4 h-4 text-sky-400"></i>
          <span>Home</span>
        </button>

        <div class="flex items-center gap-3">
          <!-- Upstream Data Logo Mark -->
          <svg viewBox="0 0 44 48" class="w-8 h-9 shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Upstream Data Logo">
            <path d="M22 3L27.5 8.5L22 14L16.5 8.5L22 3Z" fill="#38BDF8"/>
            <path d="M6 16.5C10.5 11.5 16 9.2 22 9.2C28 9.2 33.5 11.5 38 16.5" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M22 14.5L27.5 20L22 25.5L16.5 20L22 14.5Z" fill="#0EA5E9"/>
            <path d="M10 26.5C13.5 22.5 17.5 20.8 22 20.8C26.5 20.8 30.5 22.5 34 26.5" stroke="#0EA5E9" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M22 26L27.5 31.5L22 37L16.5 31.5L22 26Z" fill="#0284C7"/>
            <path d="M15.2 32.8C15.2 37.8 18.2 41.5 22 41.5C25.8 41.5 28.8 37.8 28.8 32.8L22 38.5L15.2 32.8Z" fill="#020617" stroke="#0EA5E9" stroke-width="1"/>
          </svg>
          <div>
            <h1 class="text-base sm:text-lg tracking-widest leading-tight flex items-baseline gap-1.5">
              <span class="font-light text-slate-200 lowercase">upstream</span>
              <span class="font-extrabold text-white uppercase">DATA</span>
            </h1>
            <p class="text-[11px] text-sky-400/90 hidden sm:block font-medium">Genset Build Guide — Fasteners, Electrical, Issues &amp; Specs</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 flex flex-col lg:flex-row gap-5 relative">

    <!-- Sidebar: Genset / Engine Directory -->
    <aside id="engineSidebar" class="hidden lg:flex flex-col w-full lg:w-72 shrink-0 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden self-start lg:sticky lg:top-20">
      <div class="p-4 border-b border-slate-200 bg-slate-50/70">
        <div class="flex items-center justify-between gap-2 mb-3">
          <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="cpu" class="w-4 h-4 text-slate-600"></i>
            Gensets / Engines
          </h2>
          <button id="addEngineBtn" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold transition shadow-sm">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            Add
          </button>
        </div>
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5"></i>
          <input id="engineSearchInput" type="text" placeholder="Search gensets..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
      </div>
      <div id="engineListContainer" class="divide-y divide-slate-100 max-h-[65vh] overflow-y-auto scrollbar-thin">
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 min-w-0 flex flex-col gap-5" id="mainWorkspace">
    </main>
  </div>

  <!-- Add / Edit Genset / Engine Modal -->
  <div id="engineModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="engineModalTitle" class="text-base font-bold text-slate-900">Add New Genset / Engine</h3>
        <button type="button" class="closeModalBtn p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60" data-modal="engineModal">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="engineForm" class="p-5 space-y-4">
        <input type="hidden" id="editEngineId" value="" />
        <div>
          <label for="engineNameInput" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Genset / Engine Model *</label>
          <input id="engineNameInput" type="text" required placeholder="e.g., Cummins 150kW Diesel Genset" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="engineCodeInput" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Engine / Spec Code</label>
            <input id="engineCodeInput" type="text" placeholder="e.g., QSB7 • 60Hz 480V" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>
          <div>
            <label for="engineAppInput" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Build Type / Duty</label>
            <input id="engineAppInput" type="text" placeholder="e.g., Skid-Mounted Standby" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" class="closeModalBtn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100" data-modal="engineModal">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-sky-600 hover:bg-sky-700 text-white shadow-sm">Save Genset</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / Edit Sub-Category Modal -->
  <div id="categoryModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="categoryModalTitle" class="text-base font-bold text-slate-900">Add Sub-Category</h3>
        <button type="button" class="closeModalBtn p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60" data-modal="categoryModal">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="categoryForm" class="p-5 space-y-4">
        <input type="hidden" id="editCategoryId" value="" />
        <div>
          <label for="categoryNameInput" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Sub-Category Name *</label>
          <input id="categoryNameInput" type="text" required placeholder="e.g., Skid &amp; Enclosure Bolts, Control Panel Wiring" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div id="categoryTypeWrapper">
          <label for="categoryTypeInput" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Category Layout Type</label>
          <select id="categoryTypeInput" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="bolts">Bolt / Hardware List (Bolt Name, Size, Qty, Washer)</option>
            <option value="electrical">Electrical / Wiring (Component, Spec, Connector, Notes)</option>
            <option value="issues">Issues &amp; Fixes (Symptom, Verified Fix, Status, Photo)</option>
            <option value="notes">Other Specifications / Notes</option>
            <option value="photos">Photo Gallery</option>
          </select>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" class="closeModalBtn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100" data-modal="categoryModal">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-sky-600 hover:bg-sky-700 text-white shadow-sm">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-sm overflow-hidden">
      <div class="p-5">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 id="confirmModalTitle" class="text-base font-bold text-slate-900">Confirm Action</h3>
            <p id="confirmModalMessage" class="text-sm text-slate-600 mt-1"></p>
          </div>
        </div>
        <div class="flex items-center justify-end gap-2 mt-5">
          <button id="confirmCancelBtn" type="button" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
          <button id="confirmProceedBtn" type="button" class="px-4 py-2 rounded-lg text-sm font-semibold bg-rose-600 hover:bg-rose-700 text-white">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Photo Lightbox Modal -->
  <div id="photoLightboxModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/85 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h4 id="lightboxTitle" class="text-sm font-bold text-slate-900">Photo Preview</h4>
          <p id="lightboxMeta" class="text-xs text-slate-500"></p>
        </div>
        <button type="button" class="closeModalBtn p-1 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200" data-modal="photoLightboxModal">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="bg-slate-900 flex items-center justify-center max-h-[75vh] overflow-hidden p-2">
        <img id="lightboxImg" src="" alt="Genset build photo" class="max-h-[70vh] max-w-full object-contain rounded-lg" />
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div id="passwordModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="lock" class="w-4 h-4 text-sky-600"></i>
          Password Required
        </h3>
        <button type="button" id="passwordCancelTopBtn" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="passwordForm" class="p-5 space-y-3">
        <p id="passwordActionDesc" class="text-xs text-slate-600">Enter the password to continue.</p>
        <div>
          <label for="actionPasswordInput" class="block text-xs font-semibold text-slate-700 mb-1">Password <span class="text-slate-400 font-normal">(Hint: 1234)</span></label>
          <input id="actionPasswordInput" type="password" inputmode="numeric" required placeholder="Enter password..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          <p id="passwordErrorMsg" class="hidden text-xs text-rose-600 font-medium mt-1">Incorrect password. Hint: 1234</p>
        </div>
        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
          <input id="rememberSessionCheckbox" type="checkbox" class="rounded border-slate-300 text-sky-600" />
          <span>Keep unlocked for this session</span>
        </label>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" id="passwordCancelBtn" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-sky-600 hover:bg-sky-700 text-white shadow-sm">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // =========================================================================
    // OPTIONAL CLOUD SYNC (Paste your Firebase config below if hosting online)
    // =========================================================================
    const FIREBASE_CONFIG = {
      apiKey: '',
      authDomain: '',
      projectId: '',
      storageBucket: '',
      messagingSenderId: '',
      appId: ''
    };

    const STORAGE_KEY = 'enginespec_pro_state_v5';
    const ACTION_PASSWORD = '1234';
    let sessionUnlocked = false;
    let passwordCallback = null;

    function requirePassword(desc, onSuccess) {
      if (sessionUnlocked) {
        onSuccess();
        return;
      }
      document.getElementById('passwordActionDesc').textContent = desc;
      document.getElementById('actionPasswordInput').value = '';
      document.getElementById('passwordErrorMsg').classList.add('hidden');
      passwordCallback = onSuccess;
      openModal('passwordModal');
      setTimeout(() => document.getElementById('actionPasswordInput').focus(), 50);
    }

    const CATEGORY_META = {
      bolts: { icon: 'list-checks', color: 'sky' },
      electrical: { icon: 'zap', color: 'amber' },
      issues: { icon: 'wrench', color: 'rose' },
      notes: { icon: 'clipboard-list', color: 'emerald' },
      photos: { icon: 'camera', color: 'indigo' }
    };

    const WASHER_TYPES = [
      'Hardened Flat (AN960)',
      'Split Lock',
      'Flange / Integrated',
      'Bellville / Conical',
      'Copper Crush',
      'Nylon / Sealing',
      'None'
    ];

    function getDefaultState() {
      return {
        currentView: 'engine',
        selectedEngineId: 'gs1',
        engines: [
          {
            id: 'gs1',
            name: 'Cummins 150kW Diesel Genset',
            code: 'QSB7 • 60Hz 480V 3-Phase',
            application: 'Skid-Mounted Standby Build',
            updatedAt: 'Today, 09:15 AM',
            selectedCategoryId: 'cat1',
            categories: [
              {
                id: 'cat1',
                name: 'Bolt List',
                type: 'bolts',
                locked: true,
                items: [
                  { id: 'b1', name: 'Skid Isolation Mount Bolt', size: '5/8"-11 x 2.50"', qty: 8, washer: 'Hardened Flat (AN960)', locked: true },
                  { id: 'b2', name: 'Alternator Coupling Bolt', size: 'M10 x 1.5 x 35mm', qty: 12, washer: 'Split Lock', locked: true },
                  { id: 'b3', name: 'Bellhousing / Flywheel Housing Bolt', size: 'M12 x 1.75 x 45mm', qty: 12, washer: 'Hardened Flat (AN960)', locked: false },
                  { id: 'b4', name: 'Exhaust Flex Flange Bolt', size: '3/8"-16 x 1.75"', qty: 8, washer: 'Bellville / Conical', locked: false },
                  { id: 'b5', name: 'Radiator Support Bracket Bolt', size: 'M10 x 1.5 x 30mm', qty: 6, washer: 'Flange / Integrated', locked: false }
                ]
              },
              {
                id: 'cat2',
                name: 'Electrical',
                type: 'electrical',
                locked: false,
                items: [
                  { id: 'el1', component: 'AVR Sensing & Excitation', spec: '120/240V AC Sensing (16 AWG)', connector: '12-Pin Deutsch DT', notes: 'Verify jumper for 480V Wye configuration before load test.', locked: true },
                  { id: 'el2', component: 'Block Heater Supply', spec: '120V AC / 1500W (12 AWG)', connector: 'NEMA 5-15P / Junction Box', notes: 'Mount below lower radiator hose level to prevent air pocket.', locked: false },
                  { id: 'el3', component: 'Battery Charger & DC Control', spec: '24V DC / 10A Float', connector: 'Ring Terminals (#10 Stud)', notes: 'Connect directly to battery side of disconnect switch.', locked: false }
                ]
              },
              {
                id: 'cat3',
                name: 'Issues & Fixes',
                type: 'issues',
                items: [
                  { id: 'is1', title: 'Voltage hunting at no-load (480V)', symptom: 'Generator output oscillates +/- 8V at 1800 RPM no-load', fix: 'Adjust AVR stability trim pot 1/4 turn clockwise and confirm magnetic pickup (MPU) gap is 0.025" from flywheel ring gear.', status: 'Resolved', timestamp: 'Yesterday, 03:20 PM', photo: null }
                ]
              },
              {
                id: 'cat4',
                name: 'Other Specifications',
                type: 'notes',
                items: [
                  { id: 'qn1', tag: 'Quality Standard', title: 'Load Bank & Megger Test Spec', body: 'Perform 1000V megger test on stator windings (>100 MOhm) before first crank. Run 2-hour stepped load bank test (25% / 50% / 75% / 100%) and log coolant temp.', timestamp: 'Today, 09:14 AM' },
                  { id: 'qn2', tag: 'Fluid / Fill Spec', title: 'Coolant & Lube Oil Capacity', body: 'Fill with 50/50 ELC heavy-duty coolant (6.5 gal) and 15W-40 CJ-4/CK-4 diesel oil (4.8 gal). Pressure-test cooling system to 15 PSI.', timestamp: 'Yesterday, 04:40 PM' }
                ]
              },
              {
                id: 'cat5',
                name: 'Photos',
                type: 'photos',
                items: []
              }
            ]
          },
          {
            id: 'gs2',
            name: 'CAT C9 250kW Genset',
            code: 'C9 ACERT • 60Hz 600V',
            application: 'Sound-Attenuated Enclosure',
            updatedAt: 'Yesterday, 02:10 PM',
            selectedCategoryId: 'cat6',
            categories: [
              {
                id: 'cat6',
                name: 'Bolt List',
                type: 'bolts',
                locked: false,
                items: [
                  { id: 'b6', name: 'Base Frame Sub-Tank Bolt', size: '3/4"-10 x 2.75"', qty: 10, washer: 'Hardened Flat (AN960)', locked: true },
                  { id: 'b7', name: 'Generator End Drive Disc Bolt', size: 'M12 x 1.75 x 35mm', qty: 12, washer: 'Hardened Flat (AN960)', locked: false },
                  { id: 'b8', name: 'Enclosure Louver Panel Bolt', size: 'M8 x 1.25 x 25mm', qty: 24, washer: 'Nylon / Sealing', locked: false }
                ]
              },
              {
                id: 'cat7',
                name: 'Electrical',
                type: 'electrical',
                locked: false,
                items: [
                  { id: 'el4', component: 'EMCP Control Harness', spec: '24V DC CAN J1939 (Shielded)', connector: '70-Pin ECM Plug', notes: 'Ensure 120-ohm terminating resistor is installed at controller end.', locked: false }
                ]
              },
              {
                id: 'cat8',
                name: 'Issues & Fixes',
                type: 'issues',
                items: []
              },
              {
                id: 'cat9',
                name: 'Other Specifications',
                type: 'notes',
                items: [
                  { id: 'qn3', tag: 'Alignment Check', title: 'Coupling Runout Tolerance', body: 'Check flywheel face and pilot bore runout with dial indicator — max 0.004" TIR before torquing drive disc.', timestamp: 'Yesterday, 02:10 PM' }
                ]
              },
              {
                id: 'cat10',
                name: 'Photos',
                type: 'photos',
                items: []
              }
            ]
          }
        ]
      };
    }

    let state = loadState();
    let editingRowId = null;
    let boltSearchQuery = '';
    let engineSearchQuery = '';
    let confirmCallback = null;
    let cloudDb = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.engines)) {
            return parsed;
          }
        }
      } catch (e) {}
      return getDefaultState();
    }

    function saveState(touchTimestamp = true) {
      if (touchTimestamp) {
        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const eng = getSelectedEngine();
        if (eng) eng.updatedAt = 'Today, ' + nowStr;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Storage full — try removing large photos', 'warn');
      }
      if (cloudDb) {
        cloudDb.collection('shop').doc('enginespec').set({
          engines: state.engines
        }, { merge: true }).catch(() => {});
      }
    }

    function getSelectedEngine() {
      return state.engines.find(e => e.id === state.selectedEngineId) || state.engines[0] || null;
    }

    function getSelectedCategory(engine) {
      if (!engine || !engine.categories || engine.categories.length === 0) return null;
      return engine.categories.find(c => c.id === engine.selectedCategoryId) || engine.categories[0];
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-900 text-rose-100 border-rose-700'
        : type === 'warn'
        ? 'bg-amber-900 text-amber-100 border-amber-700'
        : 'bg-slate-900 text-white border-slate-700';
      toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl border shadow-lg text-xs sm:text-sm font-medium transition-all ${colors}`;

    function compressImageFile(file, maxWidth = 900, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderPhotosCategory(engine, cat) {
      const photos = cat.items || [];

      return `
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 sm:p-5 border-b border-slate-200 bg-indigo-50/40 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

          <div class="p-4 sm:p-5">
            ${photos.length === 0 ? `
              <div class="text-center py-10 text-sm text-slate-500">
                <i data-lucide="image" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                No photos uploaded for ${escapeHtml(engine.name)} yet.
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${photos.map(p => `
                  <div class="rounded-xl border border-slate-200 overflow-hidden bg-slate-50 flex flex-col">
                    <button type="button" data-view-photo-src="${p.dataUrl}" data-view-photo-title="${escapeHtml(p.caption)}" data-view-photo-meta="${escapeHtml(p.category)} • ${escapeHtml(p.timestamp)}" class="block w-full h-44 bg-slate-900 overflow-hidden group">
                      <img src="${p.dataUrl}" alt="${escapeHtml(p.caption)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" />
                    </button>
                    <div class="p-3 flex items-start justify-between gap-2">
                      <div>
                        <span class="inline-block px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-800 text-[10px] font-semibold mb-1">${escapeHtml(p.category)}</span>
                        <div class="text-sm font-semibold text-slate-900">${escapeHtml(p.caption)}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(p.timestamp)}</div>
                      </div>
                      <button type="button" data-delete-photo="${p.id}" title="Delete photo" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </section>
      `;
    }

    // Global Listeners
    document.getElementById('homeBtn').addEventListener('click', () => {
      state.currentView = 'home';
      saveState(false);
      renderAll();
    });

    document.getElementById('engineSearchInput').addEventListener('input', (e) => {
      engineSearchQuery = e.target.value;
      renderSidebar();
      lucide.createIcons({ root: document.getElementById('engineListContainer') });
    });

    function openAddEngineModal() {
      document.getElementById('engineModalTitle').textContent = 'Add New Genset / Engine';
      document.getElementById('editEngineId').value = '';
      document.getElementById('engineNameInput').value = '';
      document.getElementById('engineCodeInput').value = '';
      document.getElementById('engineAppInput').value = '';
      openModal('engineModal');
    }

    document.getElementById('addEngineBtn').addEventListener('click', openAddEngineModal);

    document.getElementById('engineForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('editEngineId').value;
      const name = document.getElementById('engineNameInput').value.trim();
      const code = document.getElementById('engineCodeInput').value.trim();
      const app = document.getElementById('engineAppInput').value.trim();
      if (!name) return;

      if (id) {
        const eng = state.engines.find(x => x.id === id);
        if (eng) {
          eng.name = name;
          eng.code = code;
          eng.application = app;
          saveState();
          showToast(`Updated ${name}`);
        }
      } else {
        const c1 = 'cat_' + Date.now() + '_1';
        const newEng = {
          id: 'gs_' + Date.now(),
          name,
          code,
          application: app,
          updatedAt: 'Just now',
          selectedCategoryId: c1,
          categories: [
            { id: c1, name: 'Bolt List', type: 'bolts', locked: false, items: [] },
            { id: 'cat_' + Date.now() + '_2', name: 'Electrical', type: 'electrical', locked: false, items: [] },
            { id: 'cat_' + Date.now() + '_3', name: 'Issues & Fixes', type: 'issues', items: [] },
            { id: 'cat_' + Date.now() + '_4', name: 'Other Specifications', type: 'notes', items: [] },
            { id: 'cat_' + Date.now() + '_5', name: 'Photos', type: 'photos', items: [] }
          ]
        };
        state.engines.unshift(newEng);
        state.selectedEngineId = newEng.id;
        state.currentView = 'engine';
        saveState();
        showToast(`Added ${name}`);
      }
      closeModal('engineModal');
      renderAll();
    });

    function openAddCategoryModal() {
      document.getElementById('categoryModalTitle').textContent = 'Add Sub-Category';
      document.getElementById('editCategoryId').value = '';
      document.getElementById('categoryNameInput').value = '';
      document.getElementById('categoryTypeWrapper').classList.remove('hidden');
      openModal('categoryModal');
    }

    document.getElementById('categoryForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const engine = getSelectedEngine();
      if (!engine) return;
      const cid = document.getElementById('editCategoryId').value;
      const name = document.getElementById('categoryNameInput').value.trim();
      const type = document.getElementById('categoryTypeInput').value;
      if (!name) return;

      if (cid) {
        const cat = engine.categories.find(c => c.id === cid);
        if (cat) {
          cat.name = name;
          saveState();
          showToast(`Renamed to "${name}"`);
        }
      } else {
        const newCat = { id: 'cat_' + Date.now(), name, type, locked: false, items: [] };
        engine.categories.push(newCat);
        engine.selectedCategoryId = newCat.id;
        saveState();
        showToast(`Added "${name}"`);
      }
      closeModal('categoryModal');
      renderAll();
    });

    document.getElementById('confirmCancelBtn').addEventListener('click', () => {
      confirmCallback = null;
      closeModal('confirmModal');
    });

    document.getElementById('confirmProceedBtn').addEventListener('click', () => {
      if (typeof confirmCallback === 'function') confirmCallback();
      confirmCallback = null;
      closeModal('confirmModal');
    });

    function closePasswordModal() {
      passwordCallback = null;
      closeModal('passwordModal');
    }
    document.getElementById('passwordCancelBtn').addEventListener('click', closePasswordModal);
    document.getElementById('passwordCancelTopBtn').addEventListener('click', closePasswordModal);

    document.getElementById('passwordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('actionPasswordInput').value.trim();
      if (val !== ACTION_PASSWORD) {
        document.getElementById('passwordErrorMsg').classList.remove('hidden');
        return;
      }
      if (document.getElementById('rememberSessionCheckbox').checked) {
        sessionUnlocked = true;
      }
      const cb = passwordCallback;
      closePasswordModal();
      if (typeof cb === 'function') cb();
    });

    document.querySelectorAll('.closeModalBtn').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.dataset.modal));
    });

    document.getElementById('engineListContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-select-engine]');
      if (!btn) return;
      state.selectedEngineId = btn.dataset.selectEngine;
      state.currentView = 'engine';
      editingRowId = null;
      saveState(false);
      renderAll();
    });

    const mainEl = document.getElementById('mainWorkspace');

    mainEl.addEventListener('input', (e) => {
      if (e.target.id === 'boltSearchInput') {
        boltSearchQuery = e.target.value;
        const pos = e.target.selectionStart;
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        const input = document.getElementById('boltSearchInput');
        if (input) {
          input.focus();
          input.setSelectionRange(pos, pos);
        }
      }
    });

    mainEl.addEventListener('change', (e) => {
      if (e.target.id === 'issuePhotoInput') {
        const f = e.target.files?.[0];
        const label = document.getElementById('issuePhotoFileName');
        if (label) label.textContent = f ? f.name : '';
      }
    });

    mainEl.addEventListener('submit', async (e) => {
      const engine = getSelectedEngine();
      if (!engine) return;
      const activeCat = getSelectedCategory(engine);
      if (!activeCat) return;

      if (e.target.id === 'addBoltForm' && activeCat.type === 'bolts') {
        e.preventDefault();
        if (activeCat.locked) return;
        const name = document.getElementById('newBoltName').value.trim();
        const size = document.getElementById('newBoltSize').value.trim();
        const qty = parseInt(document.getElementById('newBoltQty').value, 10) || 1;
        const washer = document.getElementById('newBoltWasher').value;
        if (!name || !size) return;

        activeCat.items.push({ id: 'b_' + Date.now(), name, size, qty, washer, locked: false });
        saveState();
        renderAll();
        showToast('Fastener added');
      }

      if (e.target.id === 'addElectricalForm' && activeCat.type === 'electrical') {
        e.preventDefault();
        const component = document.getElementById('newElecComp').value.trim();
        const spec = document.getElementById('newElecSpec').value.trim();
        const connector = document.getElementById('newElecConn').value.trim();
        const notes = document.getElementById('newElecNotes').value.trim();
        if (!component || !spec) return;

        activeCat.items.push({ id: 'el_' + Date.now(), component, spec, connector, notes, locked: false });
        saveState();
        renderAll();
        showToast('Electrical spec added');
      }

      if (e.target.id === 'addIssueForm' && activeCat.type === 'issues') {
        e.preventDefault();
        const title = document.getElementById('issueTitleInput').value.trim();
        const status = document.getElementById('issueStatusInput').value;
        const symptom = document.getElementById('issueSymptomInput').value.trim();
        const fix = document.getElementById('issueFixInput').value.trim();
        const fileInput = document.getElementById('issuePhotoInput');
        if (!title || !symptom || !fix) return;

        let photoData = null;
        if (fileInput && fileInput.files && fileInput.files[0]) {
          try { photoData = await compressImageFile(fileInput.files[0]); } catch (err) {}
        }

        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        activeCat.items.unshift({
          id: 'is_' + Date.now(),
          title, status, symptom, fix,
          timestamp: 'Today, ' + nowStr,
          photo: photoData
        });
        saveState();
        renderAll();
        showToast('Issue & fix saved');
      }

      if (e.target.id === 'addQualityNoteForm' && activeCat.type === 'notes') {
        e.preventDefault();
        const title = document.getElementById('noteTitleInput').value.trim();
        const tag = document.getElementById('noteTagInput').value;
        const body = document.getElementById('noteBodyInput').value.trim();
        if (!title || !body) return;

        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        activeCat.items.unshift({
          id: 'qn_' + Date.now(),
          tag, title, body,
          timestamp: 'Today, ' + nowStr
        });
        saveState();
        renderAll();
        showToast('Specification saved');
      }

      if (e.target.id === 'addPhotoForm' && activeCat.type === 'photos') {
        e.preventDefault();
        const caption = document.getElementById('photoCaptionInput').value.trim();
        const category = document.getElementById('photoCatInput').value;
        const files = document.getElementById('photoFileInput').files;
        if (!caption || !files || files.length === 0) return;

        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        for (let i = 0; i < files.length; i++) {
          try {
            const dataUrl = await compressImageFile(files[i]);
            activeCat.items.unshift({
              id: 'ph_' + Date.now() + '_' + i,
              caption: files.length > 1 ? `${caption} (${i + 1})` : caption,
              category,
              dataUrl,
              timestamp: 'Today, ' + nowStr
            });
          } catch (err) {}
        }
        saveState();
        renderAll();
        showToast('Photo(s) uploaded');
      }
    });

    mainEl.addEventListener('click', (e) => {
      const target = e.target;

      if (target.closest('#homeAddEngineBtn')) return openAddEngineModal();

      const openHomeCard = target.closest('[data-open-engine-home]');
      if (openHomeCard) {
        state.selectedEngineId = openHomeCard.dataset.openEngineHome;
        state.currentView = 'engine';
        saveState(false);
        renderAll();
        return;
      }

      const photoTrigger = target.closest('[data-view-photo-src]');
      if (photoTrigger) {
        document.getElementById('lightboxImg').src = photoTrigger.dataset.viewPhotoSrc;
        document.getElementById('lightboxTitle').textContent = photoTrigger.dataset.viewPhotoTitle || 'Photo';
        document.getElementById('lightboxMeta').textContent = photoTrigger.dataset.viewPhotoMeta || '';
        openModal('photoLightboxModal');
        return;
      }

      const engine = getSelectedEngine();
      if (!engine) return;

      if (target.closest('#addCategoryBtn') || target.closest('#emptyAddCatBtn')) {
        return openAddCategoryModal();
      }

      const selCatBtn = target.closest('[data-select-category]');
      if (selCatBtn) {
        engine.selectedCategoryId = selCatBtn.dataset.selectCategory;
        editingRowId = null;
        saveState(false);
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        return;
      }

      const editCatBtn = target.closest('[data-edit-category]');
      if (editCatBtn) {
        const cat = engine.categories.find(c => c.id === editCatBtn.dataset.editCategory);
        if (cat) {
          requirePassword(`Enter password to rename "${cat.name}".`, () => {
            document.getElementById('categoryModalTitle').textContent = 'Rename Sub-Category';
            document.getElementById('editCategoryId').value = cat.id;
            document.getElementById('categoryNameInput').value = cat.name;
            document.getElementById('categoryTypeWrapper').classList.add('hidden');
            openModal('categoryModal');
          });
        }
        return;
      }

      const delCatBtn = target.closest('[data-delete-category]');
      if (delCatBtn) {
        const cat = engine.categories.find(c => c.id === delCatBtn.dataset.deleteCategory);
        if (cat) {
          requirePassword(`Enter password to remove "${cat.name}".`, () => {
            engine.categories = engine.categories.filter(c => c.id !== cat.id);
            engine.selectedCategoryId = engine.categories[0]?.id || null;
            saveState();
            renderAll();
            showToast(`Removed "${cat.name}"`);
          });
        }
        return;
      }

      if (target.closest('#editEngineInfoBtn')) {
        requirePassword(`Enter password to edit "${engine.name}".`, () => {
          document.getElementById('engineModalTitle').textContent = 'Edit Genset / Engine Info';
          document.getElementById('editEngineId').value = engine.id;
          document.getElementById('engineNameInput').value = engine.name;
          document.getElementById('engineCodeInput').value = engine.code || '';
          document.getElementById('engineAppInput').value = engine.application || '';
          openModal('engineModal');
        });
        return;
      }

      if (target.closest('#deleteEngineBtn')) {
        requirePassword(`Enter password to delete "${engine.name}".`, () => {
          const removedName = engine.name;
          state.engines = state.engines.filter(x => x.id !== engine.id);
          state.selectedEngineId = state.engines[0]?.id || null;
          if (!state.selectedEngineId) state.currentView = 'home';
          saveState();
          renderAll();
          showToast(`Deleted ${removedName}`);
        });
        return;
      }

      const activeCat = getSelectedCategory(engine);
      if (!activeCat) return;

      if (target.closest('#toggleListLockBtn') && activeCat.type === 'bolts') {
        const doToggle = () => {
          activeCat.locked = !activeCat.locked;
          editingRowId = null;
          saveState();
          renderAll();
          showToast(`"${activeCat.name}" ${activeCat.locked ? 'locked' : 'unlocked'}`, activeCat.locked ? 'warn' : 'success');
        };
        if (activeCat.locked) {
          requirePassword(`Enter password to unlock "${activeCat.name}".`, doToggle);
        } else {
          doToggle();
        }
        return;
      }

      const rowLockBtn = target.closest('[data-toggle-row-lock]');
      if (rowLockBtn && activeCat.type === 'bolts') {
        const bolt = activeCat.items.find(b => b.id === rowLockBtn.dataset.toggleRowLock);
        if (bolt) {
          const doRowToggle = () => {
            bolt.locked = !bolt.locked;
            if (bolt.locked && editingRowId === bolt.id) editingRowId = null;
            saveState();
            renderAll();
            showToast(`"${bolt.name}" ${bolt.locked ? 'locked' : 'unlocked'}`, bolt.locked ? 'warn' : 'success');
          };
          if (bolt.locked) {
            requirePassword(`Enter password to unlock "${bolt.name}".`, doRowToggle);
          } else {
            doRowToggle();
          }
        }
        return;
      }

      const editBoltBtn = target.closest('[data-edit-bolt]');
      if (editBoltBtn && activeCat.type === 'bolts') {
        const bolt = activeCat.items.find(b => b.id === editBoltBtn.dataset.editBolt);
        if (bolt && !activeCat.locked && !bolt.locked) {
          requirePassword(`Enter password to edit "${bolt.name}".`, () => {
            editingRowId = bolt.id;
            renderWorkspace();
            lucide.createIcons({ root: mainEl });
          });
        }
        return;
      }

      if (target.closest('[data-cancel-bolt]')) {
        editingRowId = null;
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        return;
      }

      const saveBoltBtn = target.closest('[data-save-bolt]');
      if (saveBoltBtn && activeCat.type === 'bolts') {
        const bid = saveBoltBtn.dataset.saveBolt;
        const bolt = activeCat.items.find(b => b.id === bid);
        if (bolt && !activeCat.locked && !bolt.locked) {
          const name = document.getElementById(`editBoltName_${bid}`).value.trim();
          const size = document.getElementById(`editBoltSize_${bid}`).value.trim();
          const qty = parseInt(document.getElementById(`editBoltQty_${bid}`).value, 10) || 1;
          const washer = document.getElementById(`editBoltWasher_${bid}`).value;
          if (!name || !size) return showToast('Bolt name and size are required', 'error');
          bolt.name = name;
          bolt.size = size;
          bolt.qty = qty;
          bolt.washer = washer;
          editingRowId = null;
          saveState();
          renderAll();
          showToast('Fastener updated');
        }
        return;
      }

      const delBoltBtn = target.closest('[data-delete-bolt]');
      if (delBoltBtn && activeCat.type === 'bolts') {
        const bid = delBoltBtn.dataset.deleteBolt;
        const bolt = activeCat.items.find(b => b.id === bid);
        if (bolt && !activeCat.locked && !bolt.locked) {
          requirePassword(`Enter password to delete "${bolt.name}".`, () => {
            activeCat.items = activeCat.items.filter(b => b.id !== bid);
            saveState();
            renderAll();
            showToast(`Removed ${bolt.name}`);
          });
        }
        return;
      }

      const elecLockBtn = target.closest('[data-toggle-elec-lock]');
      if (elecLockBtn && activeCat.type === 'electrical') {
        const item = activeCat.items.find(x => x.id === elecLockBtn.dataset.toggleElecLock);
        if (item) {
          const doElecToggle = () => {
            item.locked = !item.locked;
            if (item.locked && editingRowId === item.id) editingRowId = null;
            saveState();
            renderAll();
            showToast(`"${item.component}" ${item.locked ? 'locked' : 'unlocked'}`, item.locked ? 'warn' : 'success');
          };
          if (item.locked) {
            requirePassword(`Enter password to unlock "${item.component}".`, doElecToggle);
          } else {
            doElecToggle();
          }
        }
        return;
      }

      const editElecBtn = target.closest('[data-edit-elec]');
      if (editElecBtn && activeCat.type === 'electrical') {
        const eid = editElecBtn.dataset.editElec;
        requirePassword('Enter password to edit electrical spec.', () => {
          editingRowId = eid;
          renderWorkspace();
          lucide.createIcons({ root: mainEl });
        });
        return;
      }

      if (target.closest('[data-cancel-elec]')) {
        editingRowId = null;
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        return;
      }

      const saveElecBtn = target.closest('[data-save-elec]');
      if (saveElecBtn && activeCat.type === 'electrical') {
        const eid = saveElecBtn.dataset.saveElec;
        const item = activeCat.items.find(x => x.id === eid);
        if (item && !item.locked) {
          const component = document.getElementById(`editElecComp_${eid}`).value.trim();
          const spec = document.getElementById(`editElecSpec_${eid}`).value.trim();
          const connector = document.getElementById(`editElecConn_${eid}`).value.trim();
          const notes = document.getElementById(`editElecNotes_${eid}`).value.trim();
          if (!component || !spec) return showToast('Component and spec are required', 'error');
          item.component = component;
          item.spec = spec;
          item.connector = connector;
          item.notes = notes;
          editingRowId = null;
          saveState();
          renderAll();
          showToast('Electrical spec updated');
        }
        return;
      }

      const delElecBtn = target.closest('[data-delete-elec]');
      if (delElecBtn && activeCat.type === 'electrical') {
        const eid = delElecBtn.dataset.deleteElec;
        const item = activeCat.items.find(x => x.id === eid);
        if (item && !item.locked) {
          requirePassword(`Enter password to delete "${item.component}".`, () => {
            activeCat.items = activeCat.items.filter(x => x.id !== eid);
            saveState();
            renderAll();
            showToast(`Removed ${item.component}`);
          });
        }
        return;
      }

      if (target.closest('#toggleAddIssueBtn')) return document.getElementById('addIssueForm').classList.toggle('hidden');
      if (target.closest('#cancelAddIssueBtn')) return document.getElementById('addIssueForm').classList.add('hidden');

      const editIssueBtn = target.closest('[data-edit-issue]');
      if (editIssueBtn && activeCat.type === 'issues') {
        const iid = editIssueBtn.dataset.editIssue;
        requirePassword('Enter password to edit this issue.', () => {
          editingRowId = iid;
          renderWorkspace();
          lucide.createIcons({ root: mainEl });
        });
        return;
      }

      if (target.closest('[data-cancel-issue]')) {
        editingRowId = null;
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        return;
      }

      const saveIssueBtn = target.closest('[data-save-issue]');
      if (saveIssueBtn && activeCat.type === 'issues') {
        const iid = saveIssueBtn.dataset.saveIssue;
        const iss = activeCat.items.find(x => x.id === iid);
        if (iss) {
          const title = document.getElementById(`editIssueTitle_${iid}`).value.trim();
          const status = document.getElementById(`editIssueStatus_${iid}`).value;
          const symptom = document.getElementById(`editIssueSymptom_${iid}`).value.trim();
          const fix = document.getElementById(`editIssueFix_${iid}`).value.trim();
          if (!title || !symptom || !fix) return showToast('All fields are required', 'error');
          iss.title = title;
          iss.status = status;
          iss.symptom = symptom;
          iss.fix = fix;
          editingRowId = null;
          saveState();
          renderAll();
          showToast('Issue & fix updated');
        }
        return;
      }

      const delIssueBtn = target.closest('[data-delete-issue]');
      if (delIssueBtn && activeCat.type === 'issues') {
        const iid = delIssueBtn.dataset.deleteIssue;
        requirePassword('Enter password to delete this issue.', () => {
          activeCat.items = activeCat.items.filter(x => x.id !== iid);
          saveState();
          renderAll();
          showToast('Issue deleted');
        });
        return;
      }

      if (target.closest('#toggleAddNoteBtn')) return document.getElementById('addQualityNoteForm').classList.toggle('hidden');
      if (target.closest('#cancelAddNoteBtn')) return document.getElementById('addQualityNoteForm').classList.add('hidden');

      const editNoteBtn = target.closest('[data-edit-note]');
      if (editNoteBtn && activeCat.type === 'notes') {
        const nid = editNoteBtn.dataset.editNote;
        requirePassword('Enter password to edit this specification.', () => {
          editingRowId = nid;
          renderWorkspace();
          lucide.createIcons({ root: mainEl });
        });
        return;
      }

      if (target.closest('[data-cancel-note]')) {
        editingRowId = null;
        renderWorkspace();
        lucide.createIcons({ root: mainEl });
        return;
      }

      const saveNoteBtn = target.closest('[data-save-note]');
      if (saveNoteBtn && activeCat.type === 'notes') {
        const nid = saveNoteBtn.dataset.saveNote;
        const note = activeCat.items.find(n => n.id === nid);
        if (note) {
          const title = document.getElementById(`editNoteTitle_${nid}`).value.trim();
          const tag = document.getElementById(`editNoteTag_${nid}`).value;
          const body = document.getElementById(`editNoteBody_${nid}`).value.trim();
          if (!title || !body) return showToast('Title and details are required', 'error');
          const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          note.title = title;
          note.tag = tag;
          note.body = body;
          note.timestamp = 'Today, ' + nowStr;
          editingRowId = null;
          saveState();
          renderAll();
          showToast('Specification updated');
        }
        return;
      }

      const delNoteBtn = target.closest('[data-delete-note]');
      if (delNoteBtn && activeCat.type === 'notes') {
        const nid = delNoteBtn.dataset.deleteNote;
        requirePassword('Enter password to delete this specification.', () => {
          activeCat.items = activeCat.items.filter(n => n.id !== nid);
          saveState();
          renderAll();
          showToast('Specification deleted');
        });
        return;
      }

      const delPhotoBtn = target.closest('[data-delete-photo]');
      if (delPhotoBtn && activeCat.type === 'photos') {
        const pid = delPhotoBtn.dataset.deletePhoto;
        requirePassword('Enter password to delete this photo.', () => {
          activeCat.items = activeCat.items.filter(p => p.id !== pid);
          saveState();
          renderAll();
          showToast('Photo removed');
        });
      }
    });

    if (FIREBASE_CONFIG.apiKey && window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        cloudDb = firebase.firestore();
        cloudDb.collection('shop').doc('enginespec').onSnapshot((doc) => {
          if (doc.exists && Array.isArray(doc.data().engines)) {
            state.engines = doc.data().engines;
            renderAll();
          }
        });
      } catch (err) {}
    }

    renderAll();
  </script>
</body>
</html>
